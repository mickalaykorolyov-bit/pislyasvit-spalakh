name: Publish Afterlight 0.8.4k
on:
  push:
    branches: [main]
    paths:
      - Spalakh_Prototype_084k.json
      - .github/workflows/publish-game.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare local asset references for exporter
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = json.loads(pathlib.Path('Spalakh_Prototype_084k.json').read_text())
          for resource in p['resources']['resources']:
              name = resource.get('name','')
              if name.startswith('assets/'):
                  path = pathlib.Path(name)
                  if not path.is_file():
                      replacement = name
                      if name.startswith('assets/v084c/crab/'):
                          replacement = name.replace('assets/v084c/crab/', 'assets/v084c/v084c/crab/')
                      elif name.startswith('assets/v084i/sensor/'):
                          replacement = name.replace('assets/v084i/sensor/', 'assets/v084i/')
                      elif name == 'assets/v084h/sensor/sensor_device_ornate.png':
                          replacement = 'assets/v084j/sensor/sensor_off.png'
                      path = pathlib.Path(replacement)
                      if not path.is_file():
                          raise FileNotFoundError(name + ' -> ' + replacement)
                      print('Repaired stale resource path:', name, '->', replacement)
                  resource['file'] = str(path.resolve())
          pathlib.Path('_publish_input.json').write_text(json.dumps(p,ensure_ascii=False))
          print('Exporting',p['name'],'with',len(p['resources']['resources']),'resources')
          PY
      - name: Install GDevelop HTML5 CLI exporter
        run: npm install --no-audit --no-fund -g gdexporter@3.2.7
      - name: Export GDevelop project to playable HTML5
        run: gdexport --in _publish_input.json --out _published_game --verbose
      - name: Validate export contents
        run: |
          test -s _published_game/index.html
          grep -q 'gdjs\|data.js\|game' _published_game/index.html
          find _published_game -maxdepth 2 -type f | head -60
      - name: Publish generated HTML5 files to GitHub Pages main branch
        run: |
          cp -a _published_game/. .
          rm -rf _published_game _publish_input.json
          printf '0.8.4k\n' > GAME_VERSION.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Already published"
          else
            git commit -m "Publish playable 0.8.4k HTML5 export [skip ci]"
            git push origin HEAD:main
          fi
