<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ПІСЛЯСВІТ 3D — Обсерваторія • v0.9.12</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020710;color:#e8f8ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 12px #000;overflow:hidden}
#task{position:absolute;top:25px;left:27px;right:20px;font-size:clamp(12px,1.25vw,22px);font-weight:740;letter-spacing:.03em}
#status{position:absolute;bottom:67px;left:28px;right:10px;font-size:clamp(10px,.9vw,16px);font-weight:650;color:#b5f8ec}
#controls{position:absolute;bottom:27px;left:28px;font-size:clamp(11px,1vw,16px);font-weight:750;color:#c6d9ec}
#message{position:absolute;bottom:115px;left:28px;right:28px;font-size:15px;font-weight:700;color:#fef2b8}
#win{position:absolute;top:43%;left:12%;right:12%;text-align:center;font-size:clamp(24px,3.5vw,50px);font-weight:800;color:#b9ffef}
#loading{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#153849 0,#030814 67%);display:grid;place-items:center;z-index:3;text-align:center}
#loading strong{display:block;font-size:clamp(26px,4vw,55px);letter-spacing:.12em}#loadInfo{display:block;margin-top:18px;font-size:15px;color:#92c7d3}
#diag{position:absolute;top:6px;right:9px;opacity:.5;font-size:10px;pointer-events:none}
#mobile{position:absolute;bottom:10px;right:15px;display:flex;gap:8px;z-index:2;pointer-events:auto}
#mobile button{background:rgba(5,22,38,.58);border:1px solid #6ea7ae88;border-radius:12px;color:white;padding:12px 16px;font-size:20px;touch-action:none;user-select:none}
@media (pointer:fine){#mobile{display:none}}@media(max-width:650px){#controls{display:none}#status{bottom:60px;font-size:10px}#task{top:13px;left:13px}#message{bottom:102px;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body>
<div id="hud"><div id="task"></div><div id="message"></div><div id="status"></div><div id="controls">A/D — РУХ &nbsp; SPACE — СТРИБОК &nbsp; E — ОПТИКА &nbsp; R — СПОЧАТКУ</div><div id="win"></div></div>
<div id="diag">Спалах 3D • GitHub тест v0.9.12</div>
<div id="mobile"><button data-key="a" aria-label="Ліворуч">◀</button><button data-key="d" aria-label="Праворуч">▶</button><button data-key="Space" aria-label="Стрибок">⤴</button><button data-key="e" aria-label="Пульт">E</button></div>
<div id="loading"><div><strong>ПІСЛЯСВІТ</strong><span id="loadInfo">Завантаження 3D Обсерваторії…</span></div></div>
<script type="module" src="./app.js"></script>
</body></html>
